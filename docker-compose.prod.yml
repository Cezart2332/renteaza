# =============================================================================
# Stack de productie pentru Coolify.
#
# In Coolify: New Resource -> Docker Compose -> repo-ul asta
#   Base Directory:          /
#   Docker Compose Location: /docker-compose.prod.yml
#
# ATENTIE: nu adauga blocul `networks:` aici. Coolify creeaza singur reteaua,
# iar retelele custom fac containerele sa apara pe mai multe retele si Traefik
# alege imprevizibil IP-ul -> 504 intermitent.
# =============================================================================

services:
    # ------------------------------------------------------------ aplicatia web
    app:
        build:
            context: .
            dockerfile: docker/production/Dockerfile
            args:
                # se "coc" in bundle-ul JS la build; vezi COOLIFY.md
                - VITE_APP_NAME=${APP_NAME:-RENTeaza}
                - VITE_AWS_PUBLIC_URL=${AWS_PUBLIC_URL}
                - VITE_GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
        restart: unless-stopped
        environment:
            # Coolify genereaza domeniul si il ruteaza spre portul 80
            - SERVICE_FQDN_APP_80
            - APP_NAME=${APP_NAME:-RENTeaza}
            - APP_ENV=production
            - APP_DEBUG=false
            - APP_KEY=${APP_KEY}
            - APP_URL=${SERVICE_URL_APP}

            - RUN_MIGRATIONS=true
            # seederele ruleaza la fiecare deploy (roluri + cont admin)
            - RUN_SEEDERS=true

            # logurile pleaca in stdout, le vezi in Coolify
            - LOG_CHANNEL=stderr
            - LOG_LEVEL=warning

            - DB_CONNECTION=mariadb
            - DB_HOST=mariadb
            - DB_PORT=3306
            - DB_DATABASE=${MYSQL_DATABASE:-renteaza}
            - DB_USERNAME=${MYSQL_USER:-renteaza}
            - DB_PASSWORD=${SERVICE_PASSWORD_MYSQL}

            - SESSION_DRIVER=database
            # Pe http simplu (fara certificat) trebuie pus pe false, altfel
            # browserul refuza sa trimita cookie-ul de sesiune si login-ul
            # te arunca la nesfarsit inapoi la formular.
            - SESSION_SECURE_COOKIE=${SESSION_SECURE_COOKIE:-true}
            - CACHE_STORE=database
            - QUEUE_CONNECTION=database

            # fisierele stau pe discul serverului (volumul app-storage)
            - FILESYSTEM_DISK=local
            - AWS_PUBLIC_URL=${AWS_PUBLIC_URL}

            - MAIL_MAILER=${MAIL_MAILER:-smtp}
            - MAIL_HOST=${MAIL_HOST}
            - MAIL_PORT=${MAIL_PORT:-587}
            - MAIL_USERNAME=${MAIL_USERNAME}
            - MAIL_PASSWORD=${MAIL_PASSWORD}
            - MAIL_SCHEME=${MAIL_SCHEME:-smtp}
            - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
            - MAIL_FROM_NAME=${APP_NAME:-RENTeaza}

            - STRIPE_KEY=${STRIPE_KEY}
            - STRIPE_SECRET=${STRIPE_SECRET}
            - PLATFORM_FEE_PCT=${PLATFORM_FEE_PCT:-10}

            - WISE_BASE_URL=${WISE_BASE_URL:-https://api.wise.com}
            - WISE_API_TOKEN=${WISE_API_TOKEN}
            - WISE_PROFILE_ID=${WISE_PROFILE_ID}

            - VONAGE_KEY=${VONAGE_KEY}
            - VONAGE_SECRET=${VONAGE_SECRET}
            - VONAGE_SMS_FROM=${VONAGE_SMS_FROM:-Renteaza}
        volumes:
            # pozele de check-in folosesc disk-ul local 'public', nu S3
            - app-storage:/var/www/html/storage/app
        depends_on:
            mariadb:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://127.0.0.1/up"]
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 60s

    # ------------------------------------------------------------ queue worker
    queue:
        build:
            context: .
            dockerfile: docker/production/Dockerfile
        restart: unless-stopped
        command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=120", "--sleep=3", "--max-time=3600"]
        environment:
            - APP_NAME=${APP_NAME:-RENTeaza}
            - APP_ENV=production
            - APP_DEBUG=false
            - APP_KEY=${APP_KEY}
            - APP_URL=${SERVICE_URL_APP}

            # migrarile si seederele ruleaza doar in 'app'
            - RUN_MIGRATIONS=false
            - RUN_SEEDERS=false

            - LOG_CHANNEL=stderr
            - LOG_LEVEL=warning

            - DB_CONNECTION=mariadb
            - DB_HOST=mariadb
            - DB_PORT=3306
            - DB_DATABASE=${MYSQL_DATABASE:-renteaza}
            - DB_USERNAME=${MYSQL_USER:-renteaza}
            - DB_PASSWORD=${SERVICE_PASSWORD_MYSQL}

            - SESSION_DRIVER=database
            - CACHE_STORE=database
            - QUEUE_CONNECTION=database

            - FILESYSTEM_DISK=local
            - AWS_PUBLIC_URL=${AWS_PUBLIC_URL}

            - MAIL_MAILER=${MAIL_MAILER:-smtp}
            - MAIL_HOST=${MAIL_HOST}
            - MAIL_PORT=${MAIL_PORT:-587}
            - MAIL_USERNAME=${MAIL_USERNAME}
            - MAIL_PASSWORD=${MAIL_PASSWORD}
            - MAIL_SCHEME=${MAIL_SCHEME:-smtp}
            - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
            - MAIL_FROM_NAME=${APP_NAME:-RENTeaza}

            - STRIPE_KEY=${STRIPE_KEY}
            - STRIPE_SECRET=${STRIPE_SECRET}
            - PLATFORM_FEE_PCT=${PLATFORM_FEE_PCT:-10}

            - WISE_BASE_URL=${WISE_BASE_URL:-https://api.wise.com}
            - WISE_API_TOKEN=${WISE_API_TOKEN}
            - WISE_PROFILE_ID=${WISE_PROFILE_ID}

            - VONAGE_KEY=${VONAGE_KEY}
            - VONAGE_SECRET=${VONAGE_SECRET}
            - VONAGE_SMS_FROM=${VONAGE_SMS_FROM:-Renteaza}
        volumes:
            - app-storage:/var/www/html/storage/app
        depends_on:
            app:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "pgrep -f 'queue:work' > /dev/null || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 60s

    # ---------------------------------------------------------------- MariaDB
    # Nu MySQL: imaginea oficiala mysql:8 e construita pe Oracle Linux, cu glibc
    # compilat pentru x86-64-v2, si crapa pe vCPU-uri fara SSE4.2 ("Fatal glibc
    # error: CPU does not support x86-64-v2"). MariaDB e pe Debian, baseline x86-64.
    # Fara `ports:` -> ramane doar pe reteaua interna, inaccesibil din internet.
    mariadb:
        image: docker.io/library/mariadb:11.4
        restart: unless-stopped
        command:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
        environment:
            - MARIADB_DATABASE=${MYSQL_DATABASE:-renteaza}
            - MARIADB_USER=${MYSQL_USER:-renteaza}
            - MARIADB_PASSWORD=${SERVICE_PASSWORD_MYSQL}
            - MARIADB_ROOT_PASSWORD=${SERVICE_PASSWORD_MYSQLROOT}
        volumes:
            - mariadb-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 60s

volumes:
    mariadb-data:
    app-storage:
