; RENTeaza - setari PHP pentru dezvoltare in containere

memory_limit = 512M
max_execution_time = 300
max_input_time = 300

; upload de poze masini / documente / import excel
upload_max_filesize = 100M
post_max_size = 110M
max_file_uploads = 60

date.timezone = Europe/Bucharest

; erorile se vad in log-ul containerului
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
